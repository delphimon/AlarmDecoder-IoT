openapi: 3.0.3
info:
  title: AlarmDecoder IoT Web API
  description: State, diagnostics, SD firmware validation, and guarded maintenance endpoints. Access is restricted by the webUI IP/CIDR ACL.
  version: "1.1"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
paths:
  /api/state:
    get:
      summary: Get current partition state
      parameters:
        - in: query
          name: partition
          description: Configured AD2IoT partition slot.
          schema:
            type: integer
            minimum: 0
            maximum: 8
            default: 0
      responses:
        "200":
          description: Current state, or an object with an Unknown display message if no state has been received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartitionState"
        "400":
          description: Invalid partition slot.
  /api/history:
    get:
      summary: Get recent activity from this boot session
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 64
            default: 64
        - in: query
          name: partition
          description: Optional panel partition number filter.
          schema:
            type: integer
      responses:
        "200":
          description: Newest-first activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: Invalid limit.
  /api/firmware:
    get:
      summary: Inspect and validate SD-card firmware.bin
      responses:
        "200":
          description: Installed version and SD image availability, metadata, and integrity status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed_version: { type: string }
                  supported: { type: boolean }
                  sd_mounted: { type: boolean }
                  present: { type: boolean }
                  valid: { type: boolean }
                  update_in_progress: { type: boolean }
                  upgrade_available: { type: boolean }
                  size_bytes: { type: number }
                  version: { type: string }
                  project_name: { type: string }
                  build_date: { type: string }
                  build_time: { type: string }
                  error: { type: string }
  /api/action:
    post:
      summary: Restart the device or install validated SD-card firmware
      parameters:
        - in: header
          name: X-AD2IoT-Action
          required: true
          schema:
            type: string
            enum: [restart, upgradeusd]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [restart, upgradeusd]
      responses:
        "202":
          description: Action accepted. Upgrade and restart actions disconnect the client.
        "400":
          description: Invalid action or unavailable/invalid SD firmware.
        "403":
          description: Missing or mismatched action guard.
components:
  schemas:
    ZoneAlert:
      type: object
      properties:
        zone: { type: integer }
        partition: { type: integer }
        mask: { type: integer }
        state: { type: string }
        name: { type: string }
    PartitionState:
      type: object
      properties:
        event: { type: string, example: SYNC }
        uptime_ms: { type: number, format: double }
        partition: { type: integer }
        zone: { type: integer }
        ready: { type: boolean }
        armed_away: { type: boolean }
        armed_stay: { type: boolean }
        backlight_on: { type: boolean }
        programming: { type: boolean }
        zone_bypassed: { type: boolean }
        ac_power: { type: boolean }
        chime_on: { type: boolean }
        alarm_event_occurred: { type: boolean }
        alarm_sounding: { type: boolean }
        battery_low: { type: boolean }
        entry_delay_off: { type: boolean }
        fire_alarm: { type: boolean }
        system_issue: { type: boolean }
        perimeter_only: { type: boolean }
        exit_now: { type: boolean }
        system_specific: { type: integer }
        beeps: { type: integer }
        panel_type: { type: string }
        last_alpha_message: { type: string }
        last_numeric_messages: { type: string }
        mask: { type: integer }
        zone_alerts:
          type: array
          items:
            $ref: "#/components/schemas/ZoneAlert"
    HistoryEntry:
      type: object
      properties:
        sequence: { type: number, format: double }
        uptime_ms: { type: number, format: double }
        partition: { type: integer }
        zone: { type: integer }
        event: { type: string }
        alpha: { type: string }
    HistoryResponse:
      type: object
      properties:
        event: { type: string, example: HISTORY }
        uptime_ms: { type: number, format: double }
        items:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/HistoryEntry"
