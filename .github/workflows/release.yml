name: Publish firmware release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified firmware package
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: AD2IoT-Release

      - name: Create release archive
        env:
          FIRMWARE_VERSION: ${{ needs.build.outputs.firmware_version }}
        run: zip -r "${FIRMWARE_VERSION}-esp32-poe-iso-webui.zip" AD2IoT-Release

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_VERSION: ${{ needs.build.outputs.firmware_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${FIRMWARE_VERSION}-esp32-poe-iso-webui.zip" --clobber
