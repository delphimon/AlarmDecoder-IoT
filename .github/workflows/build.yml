name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: Name of the uploaded firmware artifact
        value: ${{ jobs.build.outputs.artifact_name }}
      firmware_version:
        description: Firmware version read from version.txt
        value: ${{ jobs.build.outputs.firmware_version }}

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMIO_CORE_VERSION: 6.1.19
  INTELHEX_VERSION: 2.3.0
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      firmware_version: ${{ steps.package.outputs.firmware_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v3-${{ env.PLATFORMIO_CORE_VERSION }}-${{ hashFiles('platformio.ini', 'main/CMakeLists.txt', 'main/idf_component.yml', 'dependencies.lock', '.gitmodules') }}

      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check \
            "platformio==${PLATFORMIO_CORE_VERSION}" \
            "intelhex==${INTELHEX_VERSION}"

      - name: Validate repository inputs
        run: |
          python tools/ci/validate_project.py
          python -m unittest discover -s tools/ci/tests -p "test_*.py"
          node --check contrib/webUI/flash-drive/www/app.js

      - name: Show tool versions
        run: |
          python --version
          pio --version
          python -c "from importlib.metadata import version; import intelhex; print('IntelHex', version('intelhex'))"
          node --version

      - name: Build esp32-poe-iso firmware and SPIFFS image
        run: |
          set -o pipefail
          pio run -e esp32-poe-iso 2>&1 | tee firmware-build.log
          python tools/ci/check_firmware_size.py firmware-build.log
          python tools/ci/verify_firmware_identity.py .pio/build/esp32-poe-iso/firmware.bin
          pio run -e esp32-poe-iso -t buildfs

      - name: Package and checksum release files
        id: package
        run: python tools/ci/package_release.py --build-dir .pio/build/esp32-poe-iso --output-dir AD2IoT-Release

      - name: Upload firmware package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: AD2IoT-Release
          if-no-files-found: error
          retention-days: 14
