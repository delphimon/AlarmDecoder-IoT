name: CI build

on: [push, workflow_dispatch]

env:
  PP: AD2IoT-Release
  SHELL: /bin/bash
  TERM: 'xterm-256color'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create base Artifact release package structure
        run: |
          mkdir $PP
          cp README.md CHANGELOG.md LICENSE $PP/
          mkdir $PP/esp32
          cp contrib/README-FLASH-ESP32.md contrib/ESP32-DOWNLOAD-TOOL-UPLOADING-FIRMWARE.png $PP/esp32/

      - name: Install required packages for st-device-c-ref build
        run: |
          sudo apt-get install -y  gperf cmake ninja-build ccache dfu-util

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build esp32-poe-iso
        run: pio run -e esp32-poe-iso

      - name: Build spiffs.bin for esp32-poe-iso
        run: pio run -t buildfs -e esp32-poe-iso

      - name: Create release package folders for each branch.
        run: |
          mkdir $PP/esp32/esp32-poe-iso-webui

      - name: Add esp32-poe-iso webui firmware build to release package
        run: |
          cp .pio/build/esp32-poe-iso/firmware.bin $PP/esp32/esp32-poe-iso-webui/

      - name: Add common firmware files for each branch to the package.
        run: |
          cp .pio/build/esp32-poe-iso/spiffs.bin $PP/esp32/esp32-poe-iso-webui/
          cp .pio/build/esp32-poe-iso/bootloader.bin $PP/esp32/esp32-poe-iso-webui/
          cp .pio/build/esp32-poe-iso/partitions.bin $PP/esp32/esp32-poe-iso-webui/
          cp .pio/build/esp32-poe-iso/ota_data_initial.bin $PP/esp32/esp32-poe-iso-webui/

      - name: Upload firmware package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD2IoT-Release-Package
          path: AD2IoT-Release

  smartthings:
    runs-on: ubuntu-latest
    env:
      ST_REF_COMMIT: d9450bb5dd4e1f6f25bc7987dc3192f4f5e17b3f
      ST_CORE_COMMIT: e01b64f63c078cf0caca610dd35a39e63e1ea824
      ESP_IDF_COMMIT: e5617c26f7fec52b05e87c45062510122fb9ea05

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SmartThings host tests
        run: python -m unittest discover -s test -p 'test_smartthings_*.py'

      - name: Install ESP-IDF prerequisites
        run: sudo apt-get update && sudo apt-get install -y gperf cmake ninja-build ccache dfu-util libusb-1.0-0

      - name: Check out immutable SmartThings SDK and ESP-IDF revisions
        run: |
          git clone https://github.com/SmartThingsCommunity/st-device-sdk-c-ref.git stsdk-ref
          git -C stsdk-ref checkout "$ST_REF_COMMIT"
          git -C stsdk-ref submodule update --init iot-core bsp/esp32
          test "$(git -C stsdk-ref/iot-core rev-parse HEAD)" = "$ST_CORE_COMMIT"
          test "$(git -C stsdk-ref/bsp/esp32 rev-parse HEAD)" = "$ESP_IDF_COMMIT"
          cd stsdk-ref
          python setup.py esp32

      - name: Build isolated SmartThings ESP32-POE-ISO firmware
        run: |
          mkdir -p stsdk-ref/apps/esp32/alarmdecoder_ad2iot
          rsync -a --exclude '.git' --exclude 'stsdk-ref' ./ stsdk-ref/apps/esp32/alarmdecoder_ad2iot/
          cd stsdk-ref
          python build.py esp32 alarmdecoder_ad2iot

      - name: Validate and package SmartThings images
        run: |
          build=stsdk-ref/apps/esp32/alarmdecoder_ad2iot/build
          app="$build/alarmdecoder_ad2iot_esp32.bin"
          test -f "$app"
          test "$(stat -c%s "$app")" -le $((0x1e0000))
          mkdir esp32-poe-iso-stsdk
          cp "$app" esp32-poe-iso-stsdk/application.bin
          cp "$build/bootloader/bootloader.bin" esp32-poe-iso-stsdk/
          cp "$build/partition_table/partition-table.bin" esp32-poe-iso-stsdk/
          cp "$build/ota_data_initial.bin" esp32-poe-iso-stsdk/
          cp "$build/spiffs.bin" esp32-poe-iso-stsdk/
          test "$(find esp32-poe-iso-stsdk -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Upload SmartThings firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-poe-iso-stsdk
          path: esp32-poe-iso-stsdk
