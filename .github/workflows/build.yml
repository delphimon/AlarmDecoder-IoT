name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: Name of the uploaded firmware artifact
        value: ${{ jobs.build.outputs.artifact_name }}
      firmware_version:
        description: Firmware version read from version.txt
        value: ${{ jobs.build.outputs.firmware_version }}

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMIO_CORE_VERSION: 6.1.19
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      firmware_version: ${{ steps.package.outputs.firmware_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ hashFiles('platformio.ini', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Install pinned PlatformIO Core
        run: python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Validate repository inputs
        run: |
          python tools/ci/validate_project.py
          node --check contrib/webUI/flash-drive/www/app.js

      - name: Show tool versions
        run: |
          python --version
          pio --version
          node --version

      - name: Build esp32-poe-iso firmware and SPIFFS image
        run: |
          pio run -e esp32-poe-iso
          pio run -e esp32-poe-iso -t buildfs

      - name: Package and checksum release files
        id: package
        run: python tools/ci/package_release.py --build-dir .pio/build/esp32-poe-iso --output-dir AD2IoT-Release

      - name: Upload firmware package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: AD2IoT-Release
          if-no-files-found: error
          retention-days: 14
